name: apply-hybrid-interactions
on:
  push:
    branches: [feature/hybrid-live-set-interactions-run]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hybrid-live-set-interactions-run
      - name: Fix current Week 4 marker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/apply_hybrid_interactions.py')
          s = p.read_text()
          start = s.index("old_w4 = re.search")
          end = s.index("new_w4 =", start)
          replacement = "old_w4 = re.search(r'''      \\{ id:'w4-1',[\\s\\S]*?\\n      \\{ id:'w5-intro' ''', s)\nif not old_w4:\n    raise SystemExit('w4 performance map step not found')\n"
          replacement = replacement.replace("id:'w5-intro' ", "id:'w5-intro'")
          p.write_text(s[:start] + replacement + s[end:])
          PY
      - run: python3 tools/apply_hybrid_interactions.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Commit verified interaction upgrade
        run: |
          rm .github/workflows/apply-hybrid-interactions.yml tools/apply_hybrid_interactions.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Hybrid Live Set.dc.html' test/hybrid.test.mjs .github/workflows/apply-hybrid-interactions.yml tools/apply_hybrid_interactions.py
          git commit -m "Add Hybrid performance-map interactions and layer mutes"
          git push origin HEAD:feature/hybrid-live-set-interactions-run
