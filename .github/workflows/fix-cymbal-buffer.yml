name: fix-cymbal-buffer

on:
  push:
    branches:
      - claude/drum-patterns-404-808-781m0m

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/drum-patterns-404-808-781m0m
          fetch-depth: 0
      - name: Patch cymbal noise buffer
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Behringer Setup Guide.dc.html')
          s = p.read_text()
          old = 'const size = this.audioCtx.sampleRate * 0.3;'
          new = 'const size = this.audioCtx.sampleRate * 1.1;'
          assert old in s, 'expected 0.3-second noise buffer not found'
          p.write_text(s.replace(old, new, 1))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test on Node 20
        run: npm test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test on Node 22
        run: npm test
      - name: Commit verified repair
        run: |
          rm .github/workflows/fix-cymbal-buffer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Behringer Setup Guide.dc.html' .github/workflows/fix-cymbal-buffer.yml
          git commit -m 'Fix Drum Bank cymbal decay buffer'
          git push origin HEAD:claude/drum-patterns-404-808-781m0m
