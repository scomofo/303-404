name: integrate-expanded-songbank
on:
  push:
    branches:
      - feature/expanded-learning-paths-2
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/expanded-learning-paths-2
      - run: python3 tools/fix_expanded_songbank_helper.py
      - run: python3 tools/integrate_expanded_songbank.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Commit verified integration
        run: |
          rm .github/workflows/integrate-expanded-songbank.yml
          rm tools/integrate_expanded_songbank.py
          rm tools/fix_expanded_songbank_helper.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand Song Bank and add advanced tone shaping week"
          git push origin HEAD:feature/expanded-learning-paths-2