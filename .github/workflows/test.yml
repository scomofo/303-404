name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # No install step: the suite uses only node:test and node:assert, matching the
      # guides themselves, which have no build step and no dependencies.
      - run: npm test
